{% load static %}
<aside class="sidebar" id="sidebar">

  <div class="sidebar-brand">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0
                 2-2V5a2 2 0 0 0-2-2zm-7 3a1 1 0 0 1 1 1v3h3a1 1 0 0 1
                 0 2h-3v3a1 1 0 0 1-2 0v-3H8a1 1 0 0 1 0-2h3V7a1 1 0 0 1 1-1z"/>
      </svg>
    </div>
    <div class="sidebar-brand-text">
      <span class="brand-name">MediChain</span>
      <span class="brand-role">Patient Portal</span>
    </div>
  </div>

  <div class="sidebar-hospital">
    <span class="hospital-dot"></span>
    <span class="hospital-name">{{ patient_hospital_name|default:"Patient Account" }}</span>
  </div>

  <nav class="sidebar-nav">
    <a href="{% url 'patient_dashboard' %}" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Dashboard
    </a>

    <a href="{% url 'patient_profile' %}" class="nav-item {% if active_page == 'profile' %}active{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      Profile
    </a>

    <a href="{% url 'patient_records' %}" class="nav-item {% if active_page == 'records' %}active{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      Medical Records
    </a>

    <div class="nav-divider"></div>

    <a href="{% url 'patient_logout' %}" class="nav-item nav-logout">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Logout
    </a>
  </nav>

</aside>
