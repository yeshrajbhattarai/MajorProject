{% load static %}
<!-- ─── Theme Toggle Button ──────────────────────────────────────────────────
     Included in every page — saves preference to localStorage
     Moon icon = currently dark (click to go light)
     Sun icon  = currently light (click to go dark)
─────────────────────────────────────────────────────────────────────────── -->
<button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
    <!-- moon — shown when dark mode is active -->
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <!-- sun — shown when light mode is active -->
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
</button>

<style>
/* theme toggle — fixed bottom right, visible on all pages */
.theme-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    transition: all var(--transition);
    z-index: 999;
    box-shadow: var(--shadow);
}

.theme-toggle:hover {
    background: var(--surface-2);
    color: var(--accent);
    transform: scale(1.1);
    border-color: var(--border-hover);
}

.theme-toggle svg {
    width: 17px;
    height: 17px;
}
</style>

<script>
// ─── Theme Toggle ─────────────────────────────────────────────────────────────

// apply saved theme immediately on load — prevents flash
(function() {
    const saved = localStorage.getItem('medichain_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
})();

// update icon visibility based on current theme
function updateThemeIcon(theme) {
    const btn = document.getElementById('themeToggle');
    if (!btn) return;
    const moon = btn.querySelector('.icon-moon');
    const sun  = btn.querySelector('.icon-sun');
    // dark mode active → show moon (click to switch to light)
    // light mode active → show sun (click to switch to dark)
    if (moon) moon.style.display = theme === 'dark'  ? 'block' : 'none';
    if (sun)  sun.style.display  = theme === 'light' ? 'block' : 'none';
}

// set icon on page load
document.addEventListener('DOMContentLoaded', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    updateThemeIcon(current);

    // toggle on click
    document.getElementById('themeToggle').addEventListener('click', () => {
        const curr = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = curr === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('medichain_theme', next);
        updateThemeIcon(next);
    });
});
</script>
